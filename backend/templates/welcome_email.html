<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            text-align: center;
            padding: 50px;
        }
        .welcome-box {
            background: #ffffff;
            border-radius: 8px;
            padding: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h1 {
            color: #2c3e50;
        }
        p {
            color: #34495e;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="welcome-box">
        <h1>Welcome {{ name }}!</h1>
        <p>Welcome to <strong>EthioGlobal Digital</strong>.</p>
        <p>We are excited to start working with you or your company.</p>
        <p>You can now control your activity with us.</p>
    </div>
</body>
</html>
