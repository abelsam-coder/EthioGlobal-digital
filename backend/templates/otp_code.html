<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OTP Verification</title>
</head>

<body style="margin:0; padding:0; background:#0f172a; font-family:Arial, sans-serif;">

  <table width="100%" cellpadding="0" cellspacing="0" style="padding:40px 0;">
    <tr>
      <td align="center">

        <!-- Card -->
        <table width="400" cellpadding="0" cellspacing="0" 
          style="background:rgba(255,255,255,0.05); border-radius:16px; padding:30px; border:1px solid rgba(255,255,255,0.1); color:#ffffff;">

          <!-- Title -->
          <tr>
            <td align="center" style="font-size:22px; font-weight:bold;">
              Ethio Global Digital
            </td>
          </tr>

          <!-- Greeting -->
          <tr>
            <td align="center" style="padding-top:10px; font-size:14px; color:#cbd5f5;">
              Hello {{ name }},
            </td>
          </tr>

          <!-- Subtitle -->
          <tr>
            <td align="center" style="padding-top:5px; font-size:13px; color:#94a3b8;">
              Secure OTP Verification
            </td>
          </tr>

          <!-- OTP -->
          <tr>
            <td align="center" style="padding:25px 0;">
              <div style="
                font-size:30px;
                letter-spacing:8px;
                font-weight:bold;
                padding:15px;
                border-radius:12px;
                border:1px solid rgba(255,255,255,0.2);
                color:#4f46e5;
              ">
                {{ otp }}
              </div>
            </td>
          </tr>

          <!-- Expiry -->
          <tr>
            <td align="center" style="color:#f87171; font-size:13px;">
              ⏳ Expires in 5 minutes
            </td>
          </tr>

          <!-- Button -->
          <tr>
            <td align="center" style="padding-top:25px;">
              
            </td>
          </tr>

          <!-- Footer -->
          <tr>
            <td align="center" style="padding-top:20px; font-size:12px; color:#94a3b8;">
              If you didn’t request this, ignore this email.
            </td>
          </tr>

        </table>

      </td>
    </tr>
  </table>

</body>
</html>
