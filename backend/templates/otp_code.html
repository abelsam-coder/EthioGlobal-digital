<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Tailwind CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <title>Modern UI</title>
</head>

<body class="bg-gradient-to-br from-slate-900 via-gray-900 to-black text-white min-h-screen flex items-center justify-center">

  <!-- Card -->
  <div class="w-full max-w-md bg-white/10 backdrop-blur-xl border border-white/20 rounded-2xl p-8 shadow-2xl">

    <!-- Title -->
    <h1 class="text-2xl font-bold text-center mb-2">
      Ethio Global Digital
    </h1>

    <p class="text-center text-gray-300 text-sm mb-6">
      Secure OTP Verification
    </p>

    <!-- OTP Box -->
    <div class="text-center mb-6">

      <p class="text-gray-400 text-sm mb-3">Your OTP Code</p>

      <div class="text-3xl font-mono tracking-[10px] font-bold bg-gradient-to-r from-indigo-500 to-green-400 text-transparent bg-clip-text p-4 rounded-xl border border-white/20">
        483921
      </div>

    </div>

    <!-- Timer -->
    <p class="text-center text-red-400 text-sm animate-pulse mb-6">
      ⏳ Expires in 10 minutes
    </p>

    <!-- Button -->
    <button class="w-full py-3 rounded-xl bg-indigo-600 hover:bg-indigo-700 transition font-semibold">
      Verify OTP
    </button>

    <!-- Footer -->
    <p class="text-xs text-gray-400 text-center mt-5">
      If you didn’t request this, ignore this email.
    </p>

  </div>

</body>
</html>
